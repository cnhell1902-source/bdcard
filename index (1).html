  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Romantic Serif & Clean Sans Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

  <style>
    :root {
      --sky-light: #f0f8ff;
      --sky-mid: #dbeefe;
      --sky-deep: #b8dcfa;
      --navy-ink: #16324f;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--navy-ink);
      background: linear-gradient(160deg, #f4faff 0%, #e1f1fd 45%, #cfe7fc 100%);
      overflow-x: hidden;
      min-height: 100vh;
    }

    .font-serif-romantic {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    /* Ambient floating sparkles */
    .floating-particle {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(147, 197, 253, 0.45) 70%, transparent 100%);
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.7) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: 0.85;
      }
      85% {
        opacity: 0.75;
      }
      100% {
        transform: translateY(-10vh) scale(1.15) rotate(180deg);
        opacity: 0;
      }
    }

    /* Heart pulse animation */
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.14); }
      30% { transform: scale(1); }
      45% { transform: scale(1.09); }
      60% { transform: scale(1); }
    }

    .heart-pulse {
      animation: heartBeat 2.2s infinite ease-in-out;
    }

    /* Passcode wrong shake animation */
    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-7px); }
      80% { transform: translateX(7px); }
    }

    .shake {
      animation: shakeError 0.42s ease-in-out;
    }

    /* Keypad button feel */
    .keypad-btn {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 20px -4px rgba(59, 130, 246, 0.14), inset 0 1px 1px rgba(255, 255, 255, 0.9);
      transition: transform 0.14s ease, background-color 0.18s ease, box-shadow 0.18s ease;
    }

    .keypad-btn:hover {
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 10px 24px -4px rgba(59, 130, 246, 0.24);
    }

    .keypad-btn:active {
      transform: scale(0.91);
      background: #dbeafe;
    }

    /* Floral Curtain Reveal Overlay */
    #floral-curtain {
      position: fixed;
      inset: 0;
      z-index: 60;
      pointer-events: none;
      display: flex;
      overflow: hidden;
    }

    .curtain-half {
      width: 50%;
      height: 100%;
      position: relative;
      transition: transform 1.45s cubic-bezier(0.76, 0, 0.24, 1), opacity 1.3s ease;
    }

    #floral-curtain.open .curtain-left {
      transform: translateX(-105%);
    }

    #floral-curtain.open .curtain-right {
      transform: translateX(105%);
    }

    /* Individual Flower Bloom Pop */
    .flower-blossom {
      position: absolute;
      transform: scale(0);
      transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 8px 16px rgba(30, 64, 115, 0.16));
    }

    #floral-curtain.bloomed .flower-blossom {
      transform: scale(1);
    }

    /* Polaroid Cards with soft light-blue tint */
    .polaroid-card {
      background: linear-gradient(180deg, #ffffff 0%, #f5faff 100%);
      padding: 10px 10px 20px 10px;
      border-radius: 10px;
      box-shadow: 0 14px 32px -6px rgba(22, 50, 79, 0.18), 0 4px 10px -2px rgba(22, 50, 79, 0.08);
      border: 1px solid rgba(219, 238, 254, 0.95);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease, z-index 0s;
    }

    .polaroid-card:hover {
      transform: scale(1.06) rotate(0deg) !important;
      z-index: 30;
      box-shadow: 0 22px 42px -8px rgba(37, 99, 235, 0.28);
    }

    /* Frosted Glass Letter Card */
    .glass-letter {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.76) 0%, rgba(240, 248, 255, 0.62) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(255, 255, 255, 0.88);
      box-shadow: 0 24px 60px -12px rgba(29, 78, 137, 0.18), inset 0 1px 2px rgba(255, 255, 255, 0.9);
    }

    /* Continuous scroll-linked typing cursor */
    .typing-caret {
      display: inline-block;
      width: 2px;
      height: 1.05em;
      background-color: #0284c7;
      margin-left: 2px;
      vertical-align: -0.1em;
      animation: caretBlink 0.85s steps(1, end) infinite;
    }

    .typing-caret.done {
      display: none;
    }

    @keyframes caretBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Scroll Fade-In Utility for sections */
    .reveal-section {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .reveal-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #e6f3fe;
    }
    ::-webkit-scrollbar-thumb {
      background: #93c5fd;
      border-radius: 9999px;
    }
  </style>

  <!-- =========================================================

  ========================================================== -->
  <script>
    (function () {
      const CORRECT_PASSCODE = "241110";
      const STORAGE_KEY = "light_blue_love_card_v3";

      const defaultState = {
        headline: "I love you so much, baby",
        greeting: "My Dearest,",
        letter:
          "I am writing this because words sometimes catch in my throat when I look at you, overwhelmed by how much you mean to me. Please keep this little note as a token of my heart—a small reminder of a love that belongs entirely to you, even when we are apart.\n\nEvery moment with you feels calmer, brighter, and fuller of life. Whether we are laughing over nothing or simply sitting in quiet comfort, you have a way of making the ordinary feel unforgettable.\n\nNo matter where the days take us, please remember that you are deeply cherished, endlessly admired, and held so close in my heart—today and always.",
        signoff: "Forever yours ♥",
        songs: [
          "https://open.spotify.com/track/6Qyc6fS4DsZjB2mRW9DsQs",
          "https://open.spotify.com/track/1Y3LN4zO1Edc2EluIoSPJN",
          "https://open.spotify.com/track/3AJwUDP919kvQ9QcozQPxg"
        ],
        photos: [
          { label: "MEMORY #1", caption: "Our Favorite Sky", bg: "from-sky-200 via-blue-100 to-indigo-100", icon: "☁️" },
          { label: "MEMORY #2", caption: "Late Night Talks", bg: "from-cyan-100 via-sky-200 to-blue-200", icon: "✨" },
          { label: "MEMORY #3", caption: "Every Smile", bg: "from-blue-100 via-indigo-100 to-sky-200", icon: "💙" },
          { label: "MEMORY #4", caption: "Golden Hours", bg: "from-sky-100 via-cyan-100 to-blue-100", icon: "🌊" },
          { label: "MEMORY #5", caption: "Hand in Hand", bg: "from-indigo-100 via-sky-200 to-cyan-100", icon: "🦋" },
          { label: "MEMORY #6", caption: "Always Us", bg: "from-blue-200 via-sky-100 to-indigo-100", icon: "💫" }
        ]
      };

      function cloneDefaults() {
        return JSON.parse(JSON.stringify(defaultState));
      }

      function readEmbeddedPayload() {
        try {
          const el = document.getElementById("embedded-initial-state");
          if (!el || !el.textContent) return { lockedCustomize: false, data: null };
          const parsed = JSON.parse(el.textContent);
          if (!parsed || typeof parsed !== "object") return { lockedCustomize: false, data: null };
          // Support both new envelope { lockedCustomize, data } and legacy flat object
          if ("data" in parsed || "lockedCustomize" in parsed) {
            return {
              lockedCustomize: Boolean(parsed.lockedCustomize),
              data: parsed.data && typeof parsed.data === "object" ? parsed.data : null
            };
          }
          return { lockedCustomize: false, data: parsed };
        } catch (err) {
          return { lockedCustomize: false, data: null };
        }
      }

      function mergeWithDefaults(candidate) {
        const base = cloneDefaults();
        if (!candidate || typeof candidate !== "object") return base;
        const merged = {
          ...base,
          ...candidate,
          songs: Array.isArray(candidate.songs) && candidate.songs.length > 0 ? candidate.songs : base.songs
        };
        merged.photos = base.photos.map((defPhoto, idx) => ({
          ...defPhoto,
          ...(Array.isArray(candidate.photos) && candidate.photos[idx] ? candidate.photos[idx] : {})
        }));
        return merged;
      }

      const embeddedPayload = readEmbeddedPayload();
      const isViewerLocked =
        embeddedPayload.lockedCustomize ||
        !document.getElementById("open-customize-btn") ||
        !document.getElementById("customize-modal");

      function loadState() {
        // In an exported viewer build, prioritize the baked-in embedded state
        if (isViewerLocked && embeddedPayload.data) {
          return mergeWithDefaults(embeddedPayload.data);
        }
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            return mergeWithDefaults(JSON.parse(raw));
          }
        } catch (err) {
          // Ignore storage read errors
        }
        return mergeWithDefaults(embeddedPayload.data);
      }

      let appState = loadState();
      let enteredCode = "";
      let isUnlocking = false;
      let lastRevealedChars = -1;

      const lockScreen = document.getElementById("lock-screen");
      const lockSubtitle = document.getElementById("lock-subtitle");
      const dotsContainer = document.getElementById("dots-container");
      const passDots = document.querySelectorAll(".pass-dot");
      const floralCurtain = document.getElementById("floral-curtain");
      const curtainLeft = document.getElementById("curtain-left");
      const curtainRight = document.getElementById("curtain-right");
      const mainContent = document.getElementById("main-content");

      function enforceViewerRestrictions() {
        if (!isViewerLocked) return;
        const openCustomizeBtn = document.getElementById("open-customize-btn");
        const customizeModal = document.getElementById("customize-modal");
        if (openCustomizeBtn) openCustomizeBtn.remove();
        if (customizeModal) customizeModal.remove();
      }

      function saveState() {
        if (isViewerLocked) return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        } catch (err) {
          showToast("Saved in memory (large photos will still export in file).");
        }
      }

      function showToast(msg) {
        const toast = document.getElementById("toast-box");
        const toastMsg = document.getElementById("toast-message");
        toastMsg.textContent = msg;
        toast.classList.remove("opacity-0", "-translate-y-3");
        toast.classList.add("opacity-100", "translate-y-0");
        setTimeout(() => {
          toast.classList.add("opacity-0", "-translate-y-3");
          toast.classList.remove("opacity-100", "translate-y-0");
        }, 2600);
      }

      function createAmbientSparkles() {
        const container = document.getElementById("particles-container");
        if (!container || container.childElementCount > 0) return;
        const count = 22;
        for (let i = 0; i < count; i++) {
          const dot = document.createElement("div");
          dot.className = "floating-particle";
          const size = Math.random() * 12 + 6;
          dot.style.width = `${size}px`;
          dot.style.height = `${size}px`;
          dot.style.left = `${Math.random() * 100}vw`;
          dot.style.animationDuration = `${Math.random() * 12 + 10}s`;
          dot.style.animationDelay = `-${Math.random() * 15}s`;
          container.appendChild(dot);
        }
      }

      function updateDots() {
        passDots.forEach((dot, idx) => {
          if (idx < enteredCode.length) {
            dot.classList.remove("bg-transparent", "border-sky-400");
            dot.classList.add("bg-sky-500", "border-sky-500", "scale-110");
          } else {
            dot.classList.add("bg-transparent", "border-sky-400");
            dot.classList.remove("bg-sky-500", "border-sky-500", "scale-110");
          }
        });
      }

      function handleKeyPress(digit) {
        if (isUnlocking || enteredCode.length >= 6) return;
        enteredCode += digit;
        updateDots();

        if (enteredCode.length === 6) {
          if (enteredCode === CORRECT_PASSCODE) {
            triggerUnlockSequence();
          } else {
            isUnlocking = true;
            lockSubtitle.textContent = "Try Again, My Love";
            lockSubtitle.classList.add("text-rose-500");
            dotsContainer.classList.add("shake");
            setTimeout(() => {
              dotsContainer.classList.remove("shake");
              enteredCode = "";
              updateDots();
              lockSubtitle.textContent = "Enter Passcode to Unlock";
              lockSubtitle.classList.remove("text-rose-500");
              isUnlocking = false;
            }, 520);
          }
        }
      }

      document.querySelectorAll("[data-key]").forEach((btn) => {
        btn.addEventListener("click", () => handleKeyPress(btn.getAttribute("data-key")));
      });

      document.getElementById("btn-clear").addEventListener("click", () => {
        if (isUnlocking) return;
        enteredCode = "";
        updateDots();
      });

      document.getElementById("btn-back").addEventListener("click", () => {
        if (isUnlocking || enteredCode.length === 0) return;
        enteredCode = enteredCode.slice(0, -1);
        updateDots();
      });

      document.addEventListener("keydown", (e) => {
        if (lockScreen.classList.contains("hidden")) return;
        if (e.key >= "0" && e.key <= "9") {
          handleKeyPress(e.key);
        } else if (e.key === "Backspace") {
          enteredCode = enteredCode.slice(0, -1);
          updateDots();
        } else if (e.key === "Escape") {
          enteredCode = "";
          updateDots();
        }
      });

      function generateFlowerSVG(palette) {
        const [outer, inner, center] = palette;
        return `
          <svg viewBox="0 0 120 120" class="w-full h-full">
            <g opacity="0.92">
              <circle cx="60" cy="28" r="24" fill="${outer}"/>
              <circle cx="88" cy="46" r="24" fill="${outer}"/>
              <circle cx="80" cy="80" r="24" fill="${outer}"/>
              <circle cx="40" cy="80" r="24" fill="${outer}"/>
              <circle cx="32" cy="46" r="24" fill="${outer}"/>
            </g>
            <g opacity="0.95">
              <circle cx="60" cy="38" r="16" fill="${inner}"/>
              <circle cx="78" cy="52" r="16" fill="${inner}"/>
              <circle cx="72" cy="72" r="16" fill="${inner}"/>
              <circle cx="48" cy="72" r="16" fill="${inner}"/>
              <circle cx="42" cy="52" r="16" fill="${inner}"/>
            </g>
            <circle cx="60" cy="58" r="11" fill="${center}"/>
            <circle cx="57" cy="55" r="3" fill="#ffffff" opacity="0.8"/>
          </svg>
        `;
      }

      function populateFloralCurtain() {
        curtainLeft.innerHTML = "";
        curtainRight.innerHTML = "";

        const palettes = [
          ["#93c5fd", "#dbeafe", "#fef08a"],
          ["#bfdbfe", "#eff6ff", "#bae6fd"],
          ["#7dd3fc", "#e0f2fe", "#fde68a"],
          ["#a5b4fc", "#e0e7ff", "#ffffff"],
          ["#ffffff", "#e0f2fe", "#93c5fd"]
        ];

        const rows = 8;
        const cols = 5;

        [curtainLeft, curtainRight].forEach((sideEl, sideIdx) => {
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const flower = document.createElement("div");
              flower.className = "flower-blossom";
              const size = Math.floor(Math.random() * 55) + 95;
              flower.style.width = `${size}px`;
              flower.style.height = `${size}px`;

              const topPct = (r / (rows - 1)) * 104 - 4 + (Math.random() * 6 - 3);
              const leftPct = (c / (cols - 1)) * 108 - 6 + (Math.random() * 8 - 4);
              flower.style.top = `${topPct}%`;
              flower.style.left = `${leftPct}%`;

              const distFromSeam = sideIdx === 0 ? (cols - c) : c;
              flower.style.transitionDelay = `${distFromSeam * 55 + Math.random() * 90}ms`;

              const palette = palettes[(r + c + sideIdx) % palettes.length];
              flower.innerHTML = generateFlowerSVG(palette);
              sideEl.appendChild(flower);
            }
          }
        });
      }

      function triggerUnlockSequence() {
        isUnlocking = true;
        populateFloralCurtain();
        floralCurtain.classList.remove("hidden", "open", "bloomed");

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            floralCurtain.classList.add("bloomed");
          });
        });

        setTimeout(() => {
          lockScreen.classList.add("hidden");
          mainContent.classList.remove("hidden");
          lastRevealedChars = -1;
          renderAllContent();
          observeScrollElements();
          updateScrollLetterReveal();
        }, 780);

        setTimeout(() => {
          floralCurtain.classList.add("open");
        }, 1050);

        setTimeout(() => {
          floralCurtain.classList.add("hidden");
          floralCurtain.classList.remove("open", "bloomed");
          isUnlocking = false;
        }, 2550);
      }

      function renderPolaroids() {
        const grid = document.getElementById("polaroid-grid");
        const rotations = ["-rotate-6", "rotate-3", "-rotate-3", "rotate-6", "-rotate-2", "rotate-4"];
        grid.innerHTML = "";

        appState.photos.slice(0, 6).forEach((photo, index) => {
          const card = document.createElement("div");
          card.className = `polaroid-card w-full max-w-[175px] sm:max-w-[215px] ${rotations[index % rotations.length]}`;
          const memoryBadge = photo.label || `MEMORY #${index + 1}`;
          const titleText = typeof photo.caption === "string" ? photo.caption : "";

          if (photo.dataUrl) {
            card.innerHTML = `
              <div class="aspect-square w-full overflow-hidden rounded-md bg-sky-100">
                <img src="${photo.dataUrl}" alt="${titleText || memoryBadge}" class="w-full h-full object-cover" />
              </div>
              <p class="font-serif-romantic italic text-center text-sky-900 text-sm sm:text-base mt-2 truncate">${titleText}</p>
            `;
          } else {
            card.innerHTML = `
              <div class="aspect-square w-full rounded-md bg-gradient-to-br ${photo.bg || "from-sky-100 to-blue-200"} flex flex-col items-center justify-center p-3">
                <span class="text-3xl sm:text-4xl mb-1.5 drop-shadow-sm">${photo.icon || "💙"}</span>
                <span class="text-[10px] uppercase tracking-widest text-sky-700/75 font-semibold">${memoryBadge}</span>
              </div>
              <p class="font-serif-romantic italic text-center text-sky-900 text-sm sm:text-base mt-2 truncate">${titleText}</p>
            `;
          }
          grid.appendChild(card);
        });
      }

      function getLetterParagraphs() {
        return appState.letter
          .split(/\n\s*\n/)
          .map((p) => p.trim())
          .filter((p) => p.length > 0);
      }

      function computeScrollLetterProgress() {
        const card = document.getElementById("letter-card");
        if (!card || mainContent.classList.contains("hidden")) return 0;

        const rect = card.getBoundingClientRect();
        const vh = window.innerHeight || 800;

        const startTrigger = vh * 0.85;
        const endTrigger = vh * 0.22 - Math.max(0, rect.height - vh * 0.55);
        const totalSpan = Math.max(120, startTrigger - endTrigger);
        const rawProgress = (startTrigger - rect.top) / totalSpan;

        return Math.max(0, Math.min(1, rawProgress));
      }

      function renderLetterAtProgress(progress) {
        const paragraphs = getLetterParagraphs();
        const fullText = paragraphs.join("\n\n");
        const totalChars = fullText.length;
        const revealedCount = progress >= 0.995
          ? totalChars
          : Math.floor(progress * totalChars);

        if (revealedCount === lastRevealedChars) return;
        lastRevealedChars = revealedCount;

        const letterBodyEl = document.getElementById("letter-body");
        const signoffWrap = document.getElementById("letter-signoff-wrap");
        letterBodyEl.innerHTML = "";

        let remaining = revealedCount;
        const isComplete = revealedCount >= totalChars;

        paragraphs.forEach((para, idx) => {
          const p = document.createElement("p");
          if (remaining <= 0) {
            p.textContent = "";
            p.className = "min-h-[1.5em]";
            letterBodyEl.appendChild(p);
            return;
          }

          const take = Math.min(para.length, remaining);
          const visibleSlice = para.slice(0, take);
          p.textContent = visibleSlice;

          const isCurrentTypingPara =
            !isComplete &&
            take < para.length &&
            remaining <= para.length;

          const isBoundaryCaret =
            !isComplete &&
            take === para.length &&
            idx < paragraphs.length - 1 &&
            remaining === para.length;

          if (isCurrentTypingPara || isBoundaryCaret) {
            const caret = document.createElement("span");
            caret.className = "typing-caret";
            p.appendChild(caret);
          }

          letterBodyEl.appendChild(p);
          remaining -= para.length + 2;
        });

        if (signoffWrap) {
          const signoffAlpha = Math.max(0.25, Math.min(1, (progress - 0.72) / 0.28));
          signoffWrap.style.opacity = progress >= 0.995 ? "1" : String(signoffAlpha);
        }
      }

      function updateScrollLetterReveal() {
        const p = computeScrollLetterProgress();
        renderLetterAtProgress(p);
      }

      function toSpotifyEmbedUrl(url) {
        if (!url) return "";
        try {
          const parsed = new URL(url.trim());
          if (parsed.hostname.includes("spotify.com")) {
            const match = parsed.pathname.match(/\/(track|album|playlist)\/([a-zA-Z0-9]+)/);
            if (match) {
              return `https://open.spotify.com/embed/${match[1]}/${match[2]}?utm_source=generator&theme=0`;
            }
          }
        } catch (e) {
          return "";
        }
        return "";
      }

      function renderSpotifySongs() {
        const container = document.getElementById("spotify-list");
        container.innerHTML = "";

        appState.songs.forEach((rawUrl) => {
          const embedUrl = toSpotifyEmbedUrl(rawUrl);
          if (!embedUrl) return;

          const wrapper = document.createElement("div");
          wrapper.className = "rounded-2xl overflow-hidden shadow-lg shadow-sky-900/10 bg-white/75 backdrop-blur-md p-2 border border-white";
          wrapper.innerHTML = `
            <iframe
              style="border-radius:12px"
              src="${embedUrl}"
              width="100%"
              height="152"
              frameborder="0"
              allowfullscreen=""
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
              loading="lazy">
            </iframe>
          `;
          container.appendChild(wrapper);
        });
      }

      function renderAllContent() {
        enforceViewerRestrictions();
        document.getElementById("hero-headline").textContent = appState.headline;
        document.getElementById("letter-greeting").textContent = appState.greeting;
        document.getElementById("letter-signoff").textContent = appState.signoff;

        lastRevealedChars = -1;
        updateScrollLetterReveal();
        renderPolaroids();
        renderSpotifySongs();
      }

      function observeScrollElements() {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
              }
            });
          },
          { threshold: 0.12 }
        );
        document.querySelectorAll(".reveal-section").forEach((el) => observer.observe(el));
      }

      let scrollTicking = false;
      window.addEventListener(
        "scroll",
        () => {
          if (!scrollTicking) {
            window.requestAnimationFrame(() => {
              updateScrollLetterReveal();
              scrollTicking = false;
            });
            scrollTicking = true;
          }
        },
        { passive: true }
      );
      window.addEventListener("resize", updateScrollLetterReveal, { passive: true });

      const modal = document.getElementById("customize-modal");
      const openBtn = document.getElementById("open-customize-btn");
      const closeBtn = document.getElementById("close-customize-btn");
      const form = document.getElementById("customize-form");
      const resetBtn = document.getElementById("reset-defaults-btn");
      const relockBtn = document.getElementById("relock-btn");
      const downloadShareableBtn = document.getElementById("download-shareable-btn");

      if (openBtn && modal) {
        openBtn.addEventListener("click", () => {
          document.getElementById("input-headline").value = appState.headline;
          document.getElementById("input-greeting").value = appState.greeting;
          document.getElementById("input-signoff").value = appState.signoff;
          document.getElementById("input-letter").value = appState.letter;
          for (let i = 0; i < 6; i++) {
            const capInput = document.getElementById(`input-caption-${i}`);
            if (capInput) {
              capInput.value = appState.photos[i] && typeof appState.photos[i].caption === "string"
                ? appState.photos[i].caption
                : "";
            }
          }
          document.getElementById("input-song-1").value = appState.songs[0] || "";
          document.getElementById("input-song-2").value = appState.songs[1] || "";
          document.getElementById("input-song-3").value = appState.songs[2] || "";
          modal.classList.remove("hidden");
          modal.classList.add("flex");
        });
      }

      function closeModal() {
        if (!modal) return;
        modal.classList.add("hidden");
        modal.classList.remove("flex");
      }

      if (closeBtn) closeBtn.addEventListener("click", closeModal);
      if (modal) {
        modal.addEventListener("click", (e) => {
          if (e.target === modal) closeModal();
        });
      }

      function compressImageFile(file) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement("canvas");
              const maxDim = 540;
              let w = img.width;
              let h = img.height;
              if (w > h && w > maxDim) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else if (h > maxDim) {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL("image/jpeg", 0.78));
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      async function collectFormState() {
        const nextState = JSON.parse(JSON.stringify(appState));
        nextState.headline = document.getElementById("input-headline").value.trim() || defaultState.headline;
        nextState.greeting = document.getElementById("input-greeting").value.trim() || defaultState.greeting;
        nextState.signoff = document.getElementById("input-signoff").value.trim() || defaultState.signoff;
        nextState.letter = document.getElementById("input-letter").value.trim() || defaultState.letter;

        const s1 = document.getElementById("input-song-1").value.trim();
        const s2 = document.getElementById("input-song-2").value.trim();
        const s3 = document.getElementById("input-song-3").value.trim();
        const updatedSongs = [s1, s2, s3].filter(Boolean);
        if (updatedSongs.length > 0) {
          nextState.songs = updatedSongs;
        }

        for (let i = 0; i < 6; i++) {
          const capInput = document.getElementById(`input-caption-${i}`);
          if (capInput) {
            nextState.photos[i] = {
              ...nextState.photos[i],
              caption: capInput.value.trim()
            };
          }
        }

        const fileInput = document.getElementById("input-photos");
        if (fileInput.files && fileInput.files.length > 0) {
          const selected = Array.from(fileInput.files).slice(0, 6);
          const compressed = await Promise.all(selected.map(compressImageFile));
          compressed.forEach((dataUrl, i) => {
            nextState.photos[i] = {
              ...nextState.photos[i],
              dataUrl
            };
          });
        }

        return nextState;
      }

      if (form) {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          appState = await collectFormState();
          saveState();
          renderAllContent();
          closeModal();
          showToast("Changes & photo titles saved!");
        });
      }

      if (downloadShareableBtn) {
        downloadShareableBtn.addEventListener("click", async () => {
          try {
            appState = await collectFormState();
            saveState();
            renderAllContent();

            const serializedPayload = JSON.stringify({
              lockedCustomize: true,
              data: appState
            }).replace(/</g, "\\u003c");

            const docClone = document.documentElement.cloneNode(true);

            // Permanently strip Customize UI & modal from exported shareable HTML
            const exportCustomizeBtn = docClone.querySelector("#open-customize-btn");
            const exportCustomizeModal = docClone.querySelector("#customize-modal");
            const exportLockScreen = docClone.querySelector("#lock-screen");
            const exportMain = docClone.querySelector("#main-content");
            const exportCurtain = docClone.querySelector("#floral-curtain");
            const exportParticles = docClone.querySelector("#particles-container");
            const exportLetterBody = docClone.querySelector("#letter-body");
            const exportStateScript = docClone.querySelector("#embedded-initial-state");

            if (exportCustomizeBtn) exportCustomizeBtn.remove();
            if (exportCustomizeModal) exportCustomizeModal.remove();
            if (exportLockScreen) exportLockScreen.classList.remove("hidden");
            if (exportMain) exportMain.classList.add("hidden");
            if (exportCurtain) {
              exportCurtain.classList.add("hidden");
              exportCurtain.classList.remove("open", "bloomed");
            }
            if (exportParticles) exportParticles.innerHTML = "";
            if (exportLetterBody) exportLetterBody.innerHTML = "";
            if (exportStateScript) exportStateScript.textContent = serializedPayload;

            const htmlOutput = "<!DOCTYPE html>\n" + docClone.outerHTML;
            const blob = new Blob([htmlOutput], { type: "text/html;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = "index.html";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1500);

            showToast("Downloaded viewer-only index.html!");
          } catch (err) {
            showToast("Could not export file. Try smaller photos.");
          }
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener("click", () => {
          appState = cloneDefaults();
          localStorage.removeItem(STORAGE_KEY);
          renderAllContent();
          closeModal();
          showToast("Reset to default card");
        });
      }

      if (relockBtn) {
        relockBtn.addEventListener("click", () => {
          enteredCode = "";
          updateDots();
          lastRevealedChars = -1;
          mainContent.classList.add("hidden");
          lockScreen.classList.remove("hidden");
          window.scrollTo({ top: 0, behavior: "instant" });
        });
      }

      window.addEventListener("load", () => {
        enforceViewerRestrictions();
        createAmbientSparkles();
      });
    })();
  </script>
